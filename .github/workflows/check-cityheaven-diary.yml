name: CityHeaven Diary Alert

on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Read latest diaries
        id: diary
        env:
          INSPECT_ONLY: "1"
        run: uv run check_diary.py

      - name: Check whether these posts were already notified
        uses: actions/cache@v4
        with:
          path: .cityheaven-state
          key: cityheaven-diary-${{ steps.diary.outputs.fingerprint }}
          restore-keys: |
            cityheaven-diary-

      - name: Send notification if needed
        run: uv run check_diary.py
