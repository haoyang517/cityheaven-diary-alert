name: CityHeaven Diary Alert

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: self-hosted
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      STATE_BACKEND: json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Manually check diaries and schedules
        run: uv run check_diary.py
